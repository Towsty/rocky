<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocky</title>
<style>
  /* Chroma plate #00FE01 — must match face_window.CHROMA_KEY and WebGL clear.
     Win32 LWA_COLORKEY punches this to the desktop (WebGL alpha-0 becomes a black card). */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: #00FE01 !important;
    background-color: #00FE01 !important;
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage { position: relative; width: 100%; height: 100%; background: #00FE01 !important; }
  #c { display: block; width: 100%; height: 100%; background: transparent !important; }
  #bubble {
    display: none; position: absolute; left: 8px; right: 8px; top: 8px;
    max-height: 42%; padding: 8px 10px; border-radius: 12px;
    background: rgba(20, 28, 40, 0.92); color: #e8eef8;
    font-size: 12px; line-height: 1.35; box-shadow: 0 6px 18px rgba(0,0,0,.35);
    overflow: auto; pointer-events: auto; z-index: 2;
  }
  #bubble.show { display: block; }
  #menu {
    display: none; position: absolute; min-width: 168px; max-height: 92%;
    overflow: auto; padding: 4px; border-radius: 10px;
    background: rgba(22, 30, 42, 0.96); color: #e8eef8; font-size: 12px;
    box-shadow: 0 8px 22px rgba(0,0,0,.4); z-index: 3; pointer-events: auto;
  }
  #menu.show { display: block; }
  #menu button, #menu .sep {
    display: block; width: 100%; border: 0; background: transparent; color: inherit;
    text-align: left; padding: 7px 10px; border-radius: 7px; cursor: pointer; font: inherit;
  }
  #menu .sep { opacity: 0.45; cursor: default; padding-top: 10px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.04em; }
  #menu button:hover { background: rgba(110, 198, 255, 0.18); }
</style>
</head>
<body>
  <div id="stage">
    <div id="bubble" aria-live="polite"></div>
    <div id="menu" role="menu"></div>
    <canvas id="c"></canvas>
  </div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const EMOTIONS = ["neutral","happy","sad","angry","surprised","sleepy","thinking"];
const canvas = document.getElementById("c");
const bubble = document.getElementById("bubble");
const menu = document.getElementById("menu");

let state = {
  emotion: "neutral", awake: true, listening: false, speaking: false,
  last_said: "", last_heard: "",
  pet_monitor: 0, pet_corner: "bottom-right", monitors: 1,
};
let speakPhase = 0;
let blinkT = 0;
let nextBlink = 2.8;
let swayT = 0;
let poseName = "neutral";

const renderer = new THREE.WebGLRenderer({
  canvas, alpha: true, antialias: true, premultipliedAlpha: true,
});
// Opaque chroma clear (not alpha-0 black). OS color-keys #00FE01 → wallpaper.
// Matching face_window.CHROMA_KEY / page CSS.
const CHROMA = 0x00fe01;
renderer.setClearColor(CHROMA, 1);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = null;
// Full skull + antenna + padding — never clip the head.
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 40);
camera.position.set(0, 0.02, 5.8);
camera.lookAt(0, -0.08, 0);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(2.2, 3.4, 3.5);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88ccff, 0.65);
rim.position.set(-2.6, 1.4, -1.6);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffe8d8, 0.35);
fill.position.set(-1.4, -0.2, 2.8);
scene.add(fill);

const root = new THREE.Group();
scene.add(root);

// Soft radial contact shadow (fade, not a hard plate/box)
const shadowCvs = document.createElement("canvas");
shadowCvs.width = shadowCvs.height = 128;
{
  const ctx = shadowCvs.getContext("2d");
  const g = ctx.createRadialGradient(64, 64, 8, 64, 64, 60);
  g.addColorStop(0, "rgba(0,0,0,0.28)");
  g.addColorStop(0.45, "rgba(0,0,0,0.12)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
}
const shadowTex = new THREE.CanvasTexture(shadowCvs);
const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(1.15, 1.15),
  new THREE.MeshBasicMaterial({
    map: shadowTex, transparent: true, depthWrite: false, opacity: 1,
  })
);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = -1.08;
root.add(shadow);

const whiteMat = new THREE.MeshPhysicalMaterial({
  color: 0xf5f8fc,
  roughness: 0.2,
  metalness: 0.04,
  clearcoat: 0.9,
  clearcoatRoughness: 0.15,
  envMapIntensity: 1.15,
});
const accentMat = new THREE.MeshPhysicalMaterial({
  color: 0x3db4ff,
  emissive: 0x0a3a66,
  emissiveIntensity: 0.55,
  roughness: 0.28,
  metalness: 0.12,
  clearcoat: 0.65,
});
const visorMat = new THREE.MeshPhysicalMaterial({
  color: 0x071018,
  emissive: 0x0a3048,
  emissiveIntensity: 0,
  roughness: 0.1,
  metalness: 0.6,
  clearcoat: 1.0,
  clearcoatRoughness: 0.06,
  envMapIntensity: 1.5,
});
const eyeMatL = new THREE.MeshStandardMaterial({
  color: 0x7aeeff,
  emissive: 0x2ad0ff,
  emissiveIntensity: 1.8,
  roughness: 0.3,
  metalness: 0.05,
});
const eyeMatR = eyeMatL.clone();
const mouthMat = new THREE.MeshStandardMaterial({
  color: 0x9adfff,
  emissive: 0x1a6080,
  emissiveIntensity: 0.4,
  roughness: 0.4,
  transparent: true,
  opacity: 0.85,
});

// Soft teardrop body (lathe) — not a toilet-paper tube
const bodyPts = [];
for (let i = 0; i <= 14; i++) {
  const t = i / 14;
  const y = -1.02 + t * 1.0;
  const r = 0.16 + 0.36 * Math.sin(Math.PI * Math.min(1, t * 1.15)) * (0.65 + 0.35 * t);
  bodyPts.push(new THREE.Vector2(r, y));
}
const body = new THREE.Mesh(new THREE.LatheGeometry(bodyPts, 40), whiteMat);
root.add(body);

const chest = new THREE.Mesh(new THREE.CircleGeometry(0.085, 24), accentMat.clone());
chest.position.set(0, -0.36, 0.4);
root.add(chest);

const head = new THREE.Group();
head.position.y = 0.36;
root.add(head);

const skull = new THREE.Mesh(new THREE.SphereGeometry(0.56, 40, 32), whiteMat);
skull.scale.set(1.1, 1.02, 1.02);
head.add(skull);

// Front faceplate: flattened dark oval ON the face
const visor = new THREE.Mesh(new THREE.SphereGeometry(0.48, 36, 28), visorMat);
visor.scale.set(0.9, 0.58, 0.26);
visor.position.set(0, 0.02, 0.48);
head.add(visor);

function makeSpot(x) {
  const g = new THREE.Group();
  // Local to visor — sits on the dark glass
  g.position.set(x, 0.05, 0.9);
  const spot = new THREE.Mesh(new THREE.CircleGeometry(0.085, 28), x < 0 ? eyeMatL : eyeMatR);
  spot.scale.set(1.15, 1.0, 1);
  g.add(spot);
  const halo = new THREE.Mesh(
    new THREE.CircleGeometry(0.11, 24),
    new THREE.MeshBasicMaterial({ color: 0x5ce1ff, transparent: true, opacity: 0.3 })
  );
  halo.position.z = -0.01;
  halo.scale.set(1.3, 1.15, 1);
  g.add(halo);
  g.userData = { spot, halo };
  return g;
}
const spotL = makeSpot(-0.28);
const spotR = makeSpot(0.28);
visor.add(spotL, spotR);

// Small mouth drawn on the visor (cyan, not a carved clay frown)
const mouth = new THREE.Mesh(
  new THREE.TorusGeometry(0.1, 0.016, 8, 20, Math.PI * 0.9),
  mouthMat
);
mouth.position.set(0, -0.32, 0.92);
mouth.rotation.x = Math.PI;
mouth.scale.set(1, 0.7, 1);
visor.add(mouth);

const antenna = new THREE.Group();
antenna.position.set(0.1, 0.58, 0);
head.add(antenna);
const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.026, 0.3, 10), whiteMat);
stem.position.y = 0.15;
antenna.add(stem);
const tip = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 14), accentMat.clone());
tip.position.y = 0.32;
antenna.add(tip);

const POSES = {
  neutral: {
    spotSX: 1.15, spotSY: 1.0, glow: 1.7, lookX: 0, lookY: 0,
    headPitch: 0, headYaw: 0, bounce: 0.02, antenna: 0.06, mouth: 0.75, smile: 0.2,
  },
  happy: {
    spotSX: 1.35, spotSY: 1.25, glow: 2.2, lookX: 0, lookY: 0.02,
    headPitch: -0.05, headYaw: 0, bounce: 0.1, antenna: 0.12, mouth: 1.15, smile: 1,
  },
  sad: {
    spotSX: 1.05, spotSY: 0.5, glow: 0.65, lookX: 0, lookY: -0.06,
    headPitch: 0.2, headYaw: 0, bounce: 0, antenna: 0.03, mouth: 0.5, smile: -0.7,
  },
  angry: {
    spotSX: 1.45, spotSY: 0.26, glow: 1.35, lookX: 0, lookY: 0.04,
    headPitch: -0.1, headYaw: 0, bounce: 0, antenna: 0.05, mouth: 0.4, smile: -0.55,
  },
  surprised: {
    spotSX: 1.6, spotSY: 1.55, glow: 2.5, lookX: 0, lookY: 0.04,
    headPitch: -0.12, headYaw: 0, bounce: 0.04, antenna: 0.18, mouth: 0.55, smile: 0,
  },
  sleepy: {
    spotSX: 1.3, spotSY: 0.16, glow: 0.4, lookX: 0.02, lookY: -0.02,
    headPitch: 0.3, headYaw: 0.1, bounce: 0, antenna: 0.02, mouth: 0.45, smile: 0.15,
  },
  thinking: {
    spotSX: 1.1, spotSY: 0.95, glow: 1.5, lookX: 0.14, lookY: 0.03,
    headPitch: 0.04, headYaw: -0.28, bounce: 0.01, antenna: 0.38, mouth: 0.55, smile: 0.1,
  },
};

let pose = POSES.neutral;

function setEmotion(name) {
  poseName = EMOTIONS.includes(name) ? name : "neutral";
  pose = POSES[poseName];
  tip.material.emissiveIntensity = poseName === "thinking" ? 0.95 : 0.55;
  tip.material.color.setHex(poseName === "angry" ? 0xff7a6a : poseName === "thinking" ? 0xffc857 : 0x3db4ff);
  tip.material.emissive.setHex(poseName === "angry" ? 0x4a1510 : poseName === "thinking" ? 0x553300 : 0x0a3a66);
  chest.material.emissiveIntensity = poseName === "happy" ? 0.9 : 0.55;
}

function applySpots(blinkSquint) {
  const p = pose;
  let sy = p.spotSY * (blinkSquint ? 0.1 : 1);
  let glow = p.glow * (blinkSquint ? 0.2 : 1);
  if (state.speaking && !blinkSquint) {
    glow *= 1.12 + 0.28 * Math.abs(Math.sin(speakPhase));
  }
  [spotL, spotR].forEach((g, i) => {
    const sx = p.spotSX;
    g.userData.spot.scale.set(sx, Math.max(0.08, sy), 1);
    g.userData.halo.scale.set(sx * 1.15, Math.max(0.15, sy) * 1.2, 1);
    g.userData.spot.material.emissiveIntensity = glow;
    g.userData.halo.material.opacity = 0.12 + glow * 0.09;
    const lx = p.lookX + (state.listening ? 0.03 : 0);
    const ly = p.lookY;
    g.position.x = (i === 0 ? -0.28 : 0.28) + lx * 0.2;
    g.position.y = 0.05 + ly;
  });
  if (p.smile > 0.5) {
    mouth.scale.set(1.2 * p.mouth, 1.05, 1);
    mouth.rotation.z = 0;
    mouth.material.opacity = 0.9;
  } else if (p.smile < -0.4) {
    mouth.scale.set(0.95 * p.mouth, 0.5, 1);
    mouth.rotation.z = Math.PI;
    mouth.material.opacity = 0.55;
  } else {
    mouth.scale.set(p.mouth, 0.55, 1);
    mouth.rotation.z = poseName === "thinking" ? 0.12 : 0;
    mouth.material.opacity = poseName === "surprised" ? 0.35 : 0.7;
  }
}

setEmotion("neutral");

function resize() {
  const w = canvas.clientWidth || 300;
  const h = canvas.clientHeight || 400;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
resize();
addEventListener("resize", resize);

function animate(t) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (animate.prev ? t - animate.prev : 16) / 1000);
  animate.prev = t;
  swayT += dt;
  blinkT += dt;

  const emo = state.emotion || "neutral";
  if (poseName !== emo) setEmotion(emo);
  const p = pose;
  const slumped = !state.awake;

  head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, slumped ? Math.max(p.headPitch, 0.38) : p.headPitch, 0.12);
  head.rotation.y = THREE.MathUtils.lerp(
    head.rotation.y,
    slumped ? p.headYaw * 0.4 : (state.listening && !state.speaking ? p.headYaw - 0.08 : p.headYaw),
    0.12
  );

  let blink = false;
  if (!slumped && emo !== "sleepy" && !state.speaking) {
    if (blinkT > nextBlink) {
      blink = true;
      if (blinkT > nextBlink + 0.12) {
        blinkT = 0;
        nextBlink = 2.4 + Math.random() * 3.2;
      }
    }
  }
  if (slumped) blink = true;
  applySpots(blink);

  const bob = slumped ? 0 : 0.032 + p.bounce * 0.45;
  let y = Math.sin(swayT * 1.55) * bob;
  if (state.speaking) {
    speakPhase += dt * 11;
    y += Math.abs(Math.sin(speakPhase)) * 0.018;
    chest.material.emissiveIntensity = 0.55 + 0.45 * Math.abs(Math.sin(speakPhase));
    visor.material.emissiveIntensity = 0.12 + 0.22 * Math.abs(Math.sin(speakPhase));
  } else {
    chest.material.emissiveIntensity = THREE.MathUtils.lerp(chest.material.emissiveIntensity, poseName === "happy" ? 0.9 : 0.55, 0.1);
    visor.material.emissiveIntensity = THREE.MathUtils.lerp(visor.material.emissiveIntensity, 0, 0.1);
  }
  root.position.y = THREE.MathUtils.lerp(root.position.y, slumped ? -0.2 : y, 0.1);
  root.rotation.z = THREE.MathUtils.lerp(
    root.rotation.z,
    Math.sin(swayT * 1.05) * (slumped ? 0.035 : 0.028) + (slumped ? 0.18 : 0),
    0.08
  );

  antenna.rotation.z = Math.sin(swayT * (2.4 + p.antenna * 6)) * p.antenna;
  shadow.scale.setScalar(slumped ? 0.85 : 1 + Math.sin(swayT * 1.55) * 0.035);

  renderer.render(scene, camera);
  reportHitRect();
}
requestAnimationFrame(animate);

function reportHitRect() {
  if (!window.pywebview?.api?.update_hit_rect) return;
  const r = canvas.getBoundingClientRect();
  // Generous vertical hit so antenna/head count; side padding stays click-through.
  const padX = r.width * 0.22;
  const padTop = r.height * 0.06;
  const padBot = r.height * 0.1;
  window.pywebview.api.update_hit_rect(r.left + padX, r.top + padTop, r.right - padX, r.bottom - padBot);
}

let pollInFlight = false;
async function poll() {
  if (pollInFlight) return;
  pollInFlight = true;
  try {
    const r = await fetch("/status", { cache: "no-store" });
    if (!r.ok) return;
    const s = await r.json();
    const next = s.emotion || "neutral";
    if (next !== state.emotion) setEmotion(next);
    state = {
      emotion: next,
      awake: !!s.awake,
      listening: !!s.listening,
      speaking: !!s.speaking,
      last_said: s.last_said || "",
      last_heard: s.last_heard || "",
      pet_monitor: s.pet_monitor ?? 0,
      pet_corner: s.pet_corner || "bottom-right",
      monitors: s.pet_monitors ?? 1,
    };
  } catch (_) {}
  finally { pollInFlight = false; }
}
setInterval(poll, 250);
poll();

async function api(action, payload = {}) {
  await fetch("/api/" + action, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Rocky-Console": "1" },
    body: JSON.stringify(payload),
  });
}

function buildMenu() {
  const parts = [
    `<button type="button" data-act="sleep">${state.awake ? "Sleep" : "Wake"}</button>`,
    `<button type="button" data-act="listen">${state.listening ? "Stop listen" : "Listen"}</button>`,
    `<button type="button" data-act="console">Open console</button>`,
    `<button type="button" data-act="quit">Quit face</button>`,
    `<div class="sep">Monitor</div>`,
  ];
  const n = Math.max(1, state.monitors | 0);
  for (let i = 0; i < n; i++) {
    const mark = i === state.pet_monitor ? " ✓" : "";
    parts.push(`<button type="button" data-act="monitor" data-n="${i}">Send to monitor ${i}${mark}</button>`);
  }
  parts.push(`<div class="sep">Corner</div>`);
  for (const c of ["bottom-right", "bottom-left", "top-right", "top-left"]) {
    const mark = c === state.pet_corner ? " ✓" : "";
    parts.push(`<button type="button" data-act="corner" data-c="${c}">${c}${mark}</button>`);
  }
  menu.innerHTML = parts.join("");
}

canvas.addEventListener("click", (ev) => {
  menu.classList.remove("show");
  const text = (state.last_said || "").replace(/\s+/g, " ").trim();
  bubble.textContent = text || (state.awake ? "…" : "(sleeping)");
  bubble.classList.add("show");
  clearTimeout(bubble._t);
  bubble._t = setTimeout(() => bubble.classList.remove("show"), 4500);
  ev.stopPropagation();
});

canvas.addEventListener("contextmenu", (ev) => {
  ev.preventDefault();
  bubble.classList.remove("show");
  buildMenu();
  menu.style.left = Math.min(ev.clientX, innerWidth - 180) + "px";
  menu.style.top = Math.min(ev.clientY, innerHeight - 200) + "px";
  menu.classList.add("show");
});

document.addEventListener("click", () => menu.classList.remove("show"));

menu.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  const act = btn.dataset.act;
  menu.classList.remove("show");
  if (act === "sleep") await api("sleep", { on: !!state.awake });
  else if (act === "listen") await api("listen", { on: !state.listening });
  else if (act === "console") {
    if (window.pywebview?.api?.open_console) window.pywebview.api.open_console();
    else window.open("/", "_blank");
  } else if (act === "quit") {
    if (window.pywebview?.api?.quit_face) window.pywebview.api.quit_face();
  } else if (act === "monitor") {
    await api("pet_dock", { monitor: Number(btn.dataset.n), corner: state.pet_corner });
  } else if (act === "corner") {
    await api("pet_dock", { monitor: state.pet_monitor, corner: btn.dataset.c });
  }
});
</script>
</body>
</html>
