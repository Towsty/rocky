<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocky</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: transparent !important;
    background-color: rgba(0,0,0,0) !important;
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: relative;
    width: 100%; height: 100%;
    background: transparent !important;
  }
  #c {
    display: block;
    width: 100%; height: 100%;
    background: transparent !important;
  }
  #bubble {
    display: none;
    position: absolute;
    left: 8px; right: 8px; top: 8px;
    max-height: 42%;
    padding: 8px 10px;
    border-radius: 12px;
    background: rgba(20, 28, 40, 0.92);
    color: #e8eef8;
    font-size: 12px;
    line-height: 1.35;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    overflow: auto;
    pointer-events: auto;
    z-index: 2;
  }
  #bubble.show { display: block; }
  #menu {
    display: none;
    position: absolute;
    min-width: 168px;
    max-height: 92%;
    overflow: auto;
    padding: 4px;
    border-radius: 10px;
    background: rgba(22, 30, 42, 0.96);
    color: #e8eef8;
    font-size: 12px;
    box-shadow: 0 8px 22px rgba(0,0,0,.4);
    z-index: 3;
    pointer-events: auto;
  }
  #menu.show { display: block; }
  #menu button, #menu .sep {
    display: block; width: 100%;
    border: 0; background: transparent; color: inherit;
    text-align: left; padding: 7px 10px; border-radius: 7px;
    cursor: pointer; font: inherit;
  }
  #menu .sep { opacity: 0.45; cursor: default; padding-top: 10px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  #menu button:hover { background: rgba(110, 198, 255, 0.18); }
</style>
</head>
<body>
  <div id="stage">
    <div id="bubble" aria-live="polite"></div>
    <div id="menu" role="menu"></div>
    <canvas id="c"></canvas>
  </div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";

const EMOTIONS = ["neutral","happy","sad","angry","surprised","sleepy","thinking"];
const canvas = document.getElementById("c");
const bubble = document.getElementById("bubble");
const menu = document.getElementById("menu");

let state = {
  emotion: "neutral", awake: true, listening: false, speaking: false,
  last_said: "", last_heard: "",
  pet_monitor: 0, pet_corner: "bottom-right", monitors: 1,
};
let speakPhase = 0;
let blinkT = 0;
let nextBlink = 2.5;
let swayT = 0;
let blinkClosed = false;
let pose = null; // current emotion pose targets

const renderer = new THREE.WebGLRenderer({
  canvas, alpha: true, antialias: true, premultipliedAlpha: false,
});
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
camera.position.set(0, 0.05, 3.35);

scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(2.2, 3.2, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9ab6ff, 0.4);
fill.position.set(-2.5, 0.4, 2.5);
scene.add(fill);

const root = new THREE.Group();
scene.add(root);

// soft ground shadow (tiny, keeps cutout readable)
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.55, 24),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22 })
);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = -1.15;
root.add(shadow);

const shellMat = new THREE.MeshStandardMaterial({ color: 0xc8d2de, roughness: 0.38, metalness: 0.12 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x243044, roughness: 0.45 });
const accentMat = new THREE.MeshStandardMaterial({ color: 0x6ec6ff, emissive: 0x14324a, roughness: 0.4 });
const irisMat = new THREE.MeshStandardMaterial({ color: 0x3d6ea8, roughness: 0.35 });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x101820 });
const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf7f4ea, roughness: 0.3 });
const cheekMat = new THREE.MeshStandardMaterial({ color: 0xe8a090, transparent: true, opacity: 0 });
const browMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, roughness: 0.55 });

const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.52, 0.5, 8, 20), shellMat);
body.position.y = -0.58;
root.add(body);

const head = new THREE.Group();
head.position.y = 0.42;
root.add(head);
const skull = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 24), shellMat);
skull.scale.set(1.02, 0.96, 0.92);
head.add(skull);

[-1, 1].forEach((s) => {
  const ear = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.2, 4, 10), shellMat);
  ear.position.set(s * 0.76, 0.02, 0);
  ear.rotation.z = s * 0.12;
  head.add(ear);
});

const antenna = new THREE.Group();
antenna.position.set(0, 0.76, 0);
head.add(antenna);
const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.036, 0.26, 8), shellMat);
stem.position.y = 0.13;
antenna.add(stem);
const tip = new THREE.Mesh(new THREE.SphereGeometry(0.085, 14, 14), accentMat);
tip.position.y = 0.3;
antenna.add(tip);

function makeEye(x) {
  const g = new THREE.Group();
  g.position.set(x, 0.06, 0.62);
  const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.175, 20, 16), whiteMat);
  sclera.scale.set(1, 1.05, 0.85);
  g.add(sclera);
  const iris = new THREE.Mesh(new THREE.SphereGeometry(0.095, 16, 12), irisMat);
  iris.position.z = 0.1;
  g.add(iris);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), pupilMat);
  pupil.position.z = 0.155;
  g.add(pupil);
  const shine = new THREE.Mesh(
    new THREE.SphereGeometry(0.02, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  shine.position.set(-0.03, 0.04, 0.18);
  g.add(shine);
  // Upper lid: shell-colored half-sphere that drops over the full eye
  const lidGeo = new THREE.SphereGeometry(0.19, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2);
  const lid = new THREE.Mesh(lidGeo, shellMat.clone());
  lid.rotation.x = Math.PI; // dome opens upward when lifted
  lid.position.set(0, 0.02, 0);
  g.add(lid);
  // Brow
  const brow = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.035, 0.06), browMat);
  brow.position.set(0, 0.24, 0.08);
  g.add(brow);
  g.userData = { sclera, iris, pupil, lid, brow, openY: 0.22, closedY: -0.02 };
  return g;
}
const eyeL = makeEye(-0.28);
const eyeR = makeEye(0.28);
head.add(eyeL, eyeR);

const cheekL = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 10), cheekMat);
cheekL.position.set(-0.4, -0.2, 0.58);
const cheekR = cheekL.clone();
cheekR.position.x = 0.4;
head.add(cheekL, cheekR);

// Mouth: deformable torus arc (smile / frown / O via scale+rotation)
const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.028, 10, 24, Math.PI), darkMat);
mouth.position.set(0, -0.26, 0.66);
mouth.rotation.x = Math.PI;
head.add(mouth);
const mouthO = new THREE.Mesh(
  new THREE.TorusGeometry(0.07, 0.028, 10, 20),
  darkMat
);
mouthO.position.set(0, -0.26, 0.68);
mouthO.visible = false;
head.add(mouthO);

const POSES = {
  // lidOpen: 1 = open, 0 = shut. sleepy ≈ 0.3 ≈ 70% closed.
  neutral: {
    tip: 0x6ec6ff, cheeks: 0, eyeScale: 1, lidOpen: 1,
    browYL: 0.24, browYR: 0.24, browRotL: 0, browRotR: 0, browIn: 0,
    mouthSmile: 0, mouthTight: 1, mouthO: false, lookX: 0, lookY: 0,
    headPitch: 0, headYaw: 0, bounce: 0, antennaTwitch: 0.08,
  },
  happy: {
    tip: 0x7dffb0, cheeks: 0.95, eyeScale: 1.04, lidOpen: 0.82,
    browYL: 0.27, browYR: 0.27, browRotL: -0.2, browRotR: 0.2, browIn: 0,
    mouthSmile: 1, mouthTight: 1.2, mouthO: false, lookX: 0, lookY: 0.02,
    headPitch: -0.06, headYaw: 0, bounce: 0.09, antennaTwitch: 0.14,
  },
  sad: {
    tip: 0x7aa0c8, cheeks: 0, eyeScale: 0.92, lidOpen: 0.42,
    browYL: 0.18, browYR: 0.18, browRotL: 0.4, browRotR: -0.4, browIn: 0.05,
    mouthSmile: -1, mouthTight: 1.05, mouthO: false, lookX: 0, lookY: -0.08,
    headPitch: 0.28, headYaw: 0, bounce: 0, antennaTwitch: 0.03,
  },
  angry: {
    tip: 0xff6b5a, cheeks: 0, eyeScale: 0.96, lidOpen: 0.72,
    browYL: 0.16, browYR: 0.16, browRotL: -0.55, browRotR: 0.55, browIn: 0.1,
    mouthSmile: -0.4, mouthTight: 0.65, mouthO: false, lookX: 0, lookY: 0.03,
    headPitch: -0.1, headYaw: 0, bounce: 0, antennaTwitch: 0.05,
  },
  surprised: {
    tip: 0xffe066, cheeks: 0.55, eyeScale: 1.38, lidOpen: 1.12,
    browYL: 0.34, browYR: 0.34, browRotL: -0.2, browRotR: 0.2, browIn: -0.03,
    mouthSmile: 0, mouthTight: 1, mouthO: true, lookX: 0, lookY: 0.05,
    headPitch: -0.14, headYaw: 0, bounce: 0.03, antennaTwitch: 0.2,
  },
  sleepy: {
    tip: 0x8a9bb0, cheeks: 0, eyeScale: 0.9, lidOpen: 0.3,
    browYL: 0.2, browYR: 0.2, browRotL: 0.12, browRotR: -0.12, browIn: 0,
    mouthSmile: 0.2, mouthTight: 0.95, mouthO: false, lookX: 0.02, lookY: -0.05,
    headPitch: 0.4, headYaw: 0.1, bounce: 0, antennaTwitch: 0.02,
  },
  thinking: {
    tip: 0xffc857, cheeks: 0, eyeScale: 1.0, lidOpen: 0.92,
    // one brow up (left), right stays near rest
    browYL: 0.32, browYR: 0.23, browRotL: -0.45, browRotR: 0.08, browIn: 0,
    mouthSmile: 0.15, mouthTight: 0.9, mouthO: false, lookX: 0.12, lookY: 0.02,
    headPitch: 0.04, headYaw: -0.32, bounce: 0, antennaTwitch: 0.42,
  },
};

function setEmotion(name) {
  const emo = EMOTIONS.includes(name) ? name : "neutral";
  pose = POSES[emo];
  tip.material.color.setHex(pose.tip);
  tip.material.emissive.setHex(emo === "thinking" ? 0x553300 : emo === "angry" ? 0x401010 : 0x14324a);
  cheekMat.opacity = pose.cheeks;
  mouth.visible = !pose.mouthO;
  mouthO.visible = !!pose.mouthO;
  if (pose.mouthSmile > 0.5) {
    mouth.scale.set(1.25 * pose.mouthTight, 1.55, 1);
    mouth.rotation.z = 0;
    mouth.position.y = -0.22;
  } else if (pose.mouthSmile < -0.5) {
    mouth.scale.set(1.1 * pose.mouthTight, 1.25, 1);
    mouth.rotation.z = Math.PI;
    mouth.position.y = -0.32;
  } else if (pose.mouthSmile < 0) {
    mouth.scale.set(pose.mouthTight, 0.75, 1);
    mouth.rotation.z = Math.PI;
    mouth.position.y = -0.28;
  } else {
    mouth.scale.set(pose.mouthTight, 1, 1);
    mouth.rotation.z = emo === "thinking" ? 0.22 : 0;
    mouth.position.y = -0.26;
  }
  [eyeL, eyeR].forEach((eye, i) => {
    const s = pose.eyeScale;
    eye.userData.sclera.scale.set(s, s * 1.05, 0.85);
    eye.userData.iris.scale.setScalar(s);
    eye.userData.pupil.scale.setScalar(s);
    const side = i === 0 ? -1 : 1;
    const browY = i === 0 ? pose.browYL : pose.browYR;
    const browRot = i === 0 ? pose.browRotL : pose.browRotR;
    eye.userData.brow.position.y = browY;
    eye.userData.brow.position.x = side * pose.browIn;
    eye.userData.brow.rotation.z = browRot;
  });
}

function setLidAmount(amount) {
  // 1 = fully open, 0 = fully closed over the eye
  const a = Math.max(0, Math.min(1.2, amount));
  [eyeL, eyeR].forEach((eye) => {
    const y = eye.userData.closedY + (eye.userData.openY - eye.userData.closedY) * a;
    eye.userData.lid.position.y = y;
    // keep lid large enough to cover sclera when closing
    eye.userData.lid.scale.set(1.05, 1.05, 1.05);
  });
}

setEmotion("neutral");

function resize() {
  const w = canvas.clientWidth || 220;
  const h = canvas.clientHeight || 260;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
resize();
addEventListener("resize", resize);

function animate(t) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (animate.prev ? t - animate.prev : 16) / 1000);
  animate.prev = t;
  swayT += dt;
  blinkT += dt;

  const emo = state.emotion || "neutral";
  if (!pose || animate._emo !== emo) {
    animate._emo = emo;
    setEmotion(emo);
  }
  const p = pose || POSES.neutral;
  // Full sleep only when awake timer expired. Sleepy emotion keeps 70% lids while awake.
  const slumped = !state.awake;
  const targetPitch = slumped ? Math.max(p.headPitch, 0.48) : p.headPitch;
  const targetYaw = slumped ? p.headYaw * 0.5 : (state.listening && !state.speaking ? p.headYaw - 0.1 : p.headYaw);
  head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, targetPitch, 0.12);
  head.rotation.y = THREE.MathUtils.lerp(head.rotation.y, targetYaw, 0.12);

  let lid = slumped ? 0 : p.lidOpen;
  if (!slumped && emo !== "sleepy" && !state.speaking) {
    if (blinkT > nextBlink) {
      blinkClosed = true;
      lid = 0; // lids over complete eyes — never swap pupils-only vs full eyes
      if (blinkT > nextBlink + 0.14) {
        blinkClosed = false;
        blinkT = 0;
        nextBlink = 2.2 + Math.random() * 3.0;
      }
    }
  }
  setLidAmount(lid);

  const sway = slumped ? 0.02 : 0.045;
  const bounce = (!slumped && (p.bounce || state.speaking)) ? (p.bounce + (state.speaking ? 0.05 : 0)) : 0;
  root.rotation.z = THREE.MathUtils.lerp(root.rotation.z, Math.sin(swayT * 1.3) * sway + (slumped ? 0.28 : 0), 0.1);
  let y = Math.sin(swayT * 2.0) * 0.025;
  if (bounce) y += Math.abs(Math.sin(swayT * 6)) * bounce;
  if (state.speaking) {
    speakPhase += dt * 14;
    y += Math.abs(Math.sin(speakPhase)) * 0.014;
    if (!p.mouthO) {
      mouth.scale.y = (p.mouthSmile > 0.5 ? 1.45 : 1) * (1.05 + Math.abs(Math.sin(speakPhase)) * 0.55);
    } else {
      mouthO.scale.setScalar(1 + Math.abs(Math.sin(speakPhase)) * 0.25);
    }
  }
  root.position.y = THREE.MathUtils.lerp(root.position.y, slumped ? -0.28 : y, 0.12);

  const lookX = p.lookX + (state.listening ? 0.04 : Math.sin(swayT * 0.6) * 0.015);
  const lookY = p.lookY;
  [eyeL, eyeR].forEach((eye) => {
    eye.userData.pupil.position.x = THREE.MathUtils.lerp(eye.userData.pupil.position.x, lookX, 0.15);
    eye.userData.pupil.position.y = THREE.MathUtils.lerp(eye.userData.pupil.position.y, lookY, 0.15);
    eye.userData.iris.position.x = eye.userData.pupil.position.x * 0.7;
    eye.userData.iris.position.y = eye.userData.pupil.position.y * 0.7;
  });

  antenna.rotation.z = Math.sin(swayT * (3 + p.antennaTwitch * 8)) * p.antennaTwitch;
  renderer.render(scene, camera);
  reportHitRect();
}
requestAnimationFrame(animate);

function reportHitRect() {
  if (!window.pywebview?.api?.update_hit_rect) return;
  const r = canvas.getBoundingClientRect();
  const padX = r.width * 0.2;
  const padY = r.height * 0.14;
  window.pywebview.api.update_hit_rect(r.left + padX, r.top + padY, r.right - padX, r.bottom - padY * 0.55);
}

async function poll() {
  try {
    const r = await fetch("/status", { cache: "no-store" });
    if (!r.ok) return;
    const s = await r.json();
    const next = s.emotion || "neutral";
    if (next !== state.emotion) setEmotion(next);
    state = {
      emotion: next,
      awake: !!s.awake,
      listening: !!s.listening,
      speaking: !!s.speaking,
      last_said: s.last_said || "",
      last_heard: s.last_heard || "",
      pet_monitor: s.pet_monitor ?? 0,
      pet_corner: s.pet_corner || "bottom-right",
      monitors: s.pet_monitors ?? 1,
    };
  } catch (_) {}
}
setInterval(poll, 200);
poll();

async function api(action, payload = {}) {
  await fetch("/api/" + action, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Rocky-Console": "1" },
    body: JSON.stringify(payload),
  });
}

function buildMenu() {
  const parts = [
    `<button type="button" data-act="sleep">${state.awake ? "Sleep" : "Wake"}</button>`,
    `<button type="button" data-act="listen">${state.listening ? "Stop listen" : "Listen"}</button>`,
    `<button type="button" data-act="console">Open console</button>`,
    `<button type="button" data-act="quit">Quit face</button>`,
    `<div class="sep">Monitor</div>`,
  ];
  const n = Math.max(1, state.monitors | 0);
  for (let i = 0; i < n; i++) {
    const mark = i === state.pet_monitor ? " ✓" : "";
    parts.push(`<button type="button" data-act="monitor" data-n="${i}">Send to monitor ${i}${mark}</button>`);
  }
  parts.push(`<div class="sep">Corner</div>`);
  for (const c of ["bottom-right", "bottom-left", "top-right", "top-left"]) {
    const mark = c === state.pet_corner ? " ✓" : "";
    parts.push(`<button type="button" data-act="corner" data-c="${c}">${c}${mark}</button>`);
  }
  menu.innerHTML = parts.join("");
}

canvas.addEventListener("click", (ev) => {
  menu.classList.remove("show");
  const text = (state.last_said || "").replace(/\s+/g, " ").trim();
  bubble.textContent = text || (state.awake ? "…" : "(sleeping)");
  bubble.classList.add("show");
  clearTimeout(bubble._t);
  bubble._t = setTimeout(() => bubble.classList.remove("show"), 4500);
  ev.stopPropagation();
});

canvas.addEventListener("contextmenu", (ev) => {
  ev.preventDefault();
  bubble.classList.remove("show");
  buildMenu();
  menu.style.left = Math.min(ev.clientX, innerWidth - 180) + "px";
  menu.style.top = Math.min(ev.clientY, innerHeight - 200) + "px";
  menu.classList.add("show");
});

document.addEventListener("click", () => menu.classList.remove("show"));

menu.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  const act = btn.dataset.act;
  menu.classList.remove("show");
  if (act === "sleep") await api("sleep", { on: !!state.awake });
  else if (act === "listen") await api("listen", { on: !state.listening });
  else if (act === "console") {
    if (window.pywebview?.api?.open_console) window.pywebview.api.open_console();
    else window.open("/", "_blank");
  } else if (act === "quit") {
    if (window.pywebview?.api?.quit_face) window.pywebview.api.quit_face();
  } else if (act === "monitor") {
    await api("pet_dock", { monitor: Number(btn.dataset.n), corner: state.pet_corner });
  } else if (act === "corner") {
    await api("pet_dock", { monitor: state.pet_monitor, corner: btn.dataset.c });
  }
});
</script>
</body>
</html>
