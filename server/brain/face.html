<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocky</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: transparent !important;
    background-color: rgba(0,0,0,0) !important;
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage { position: relative; width: 100%; height: 100%; background: transparent !important; }
  #c { display: block; width: 100%; height: 100%; background: transparent !important; }
  #bubble {
    display: none; position: absolute; left: 8px; right: 8px; top: 8px;
    max-height: 42%; padding: 8px 10px; border-radius: 12px;
    background: rgba(20, 28, 40, 0.92); color: #e8eef8;
    font-size: 12px; line-height: 1.35; box-shadow: 0 6px 18px rgba(0,0,0,.35);
    overflow: auto; pointer-events: auto; z-index: 2;
  }
  #bubble.show { display: block; }
  #menu {
    display: none; position: absolute; min-width: 168px; max-height: 92%;
    overflow: auto; padding: 4px; border-radius: 10px;
    background: rgba(22, 30, 42, 0.96); color: #e8eef8; font-size: 12px;
    box-shadow: 0 8px 22px rgba(0,0,0,.4); z-index: 3; pointer-events: auto;
  }
  #menu.show { display: block; }
  #menu button, #menu .sep {
    display: block; width: 100%; border: 0; background: transparent; color: inherit;
    text-align: left; padding: 7px 10px; border-radius: 7px; cursor: pointer; font: inherit;
  }
  #menu .sep { opacity: 0.45; cursor: default; padding-top: 10px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.04em; }
  #menu button:hover { background: rgba(110, 198, 255, 0.18); }
</style>
</head>
<body>
  <div id="stage">
    <div id="bubble" aria-live="polite"></div>
    <div id="menu" role="menu"></div>
    <canvas id="c"></canvas>
  </div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const EMOTIONS = ["neutral","happy","sad","angry","surprised","sleepy","thinking"];
const canvas = document.getElementById("c");
const bubble = document.getElementById("bubble");
const menu = document.getElementById("menu");

let state = {
  emotion: "neutral", awake: true, listening: false, speaking: false,
  last_said: "", last_heard: "",
  pet_monitor: 0, pet_corner: "bottom-right", monitors: 1,
};
let speakPhase = 0;
let blinkT = 0;
let nextBlink = 2.8;
let swayT = 0;
let poseName = "neutral";

const renderer = new THREE.WebGLRenderer({
  canvas, alpha: true, antialias: true, premultipliedAlpha: false,
});
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 40);
camera.position.set(0, 0.12, 3.6);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.35);
key.position.set(2.4, 3.6, 3.2);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88ccff, 0.55);
rim.position.set(-2.8, 1.2, -1.5);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffe8d8, 0.35);
fill.position.set(-1.2, -0.4, 3);
scene.add(fill);

const root = new THREE.Group();
scene.add(root);

const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.48, 28),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18 })
);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = -1.05;
root.add(shadow);

// Glossy toy plastic
const whiteMat = new THREE.MeshPhysicalMaterial({
  color: 0xf4f7fb,
  roughness: 0.22,
  metalness: 0.05,
  clearcoat: 0.85,
  clearcoatRoughness: 0.18,
  envMapIntensity: 1.1,
});
const accentMat = new THREE.MeshPhysicalMaterial({
  color: 0x3db4ff,
  emissive: 0x0a3a66,
  emissiveIntensity: 0.55,
  roughness: 0.3,
  metalness: 0.15,
  clearcoat: 0.6,
});
const visorMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a121c,
  roughness: 0.12,
  metalness: 0.55,
  clearcoat: 1.0,
  clearcoatRoughness: 0.08,
  envMapIntensity: 1.4,
});
const eyeMatL = new THREE.MeshStandardMaterial({
  color: 0x5ce1ff,
  emissive: 0x2ad0ff,
  emissiveIntensity: 1.6,
  roughness: 0.35,
  metalness: 0.1,
});
const eyeMatR = eyeMatL.clone();
const mouthMat = new THREE.MeshStandardMaterial({
  color: 0x1a2433,
  roughness: 0.5,
  transparent: true,
  opacity: 0.55,
});

// Soft teardrop / little astronaut: large head + compact rounded body
const body = new THREE.Mesh(new THREE.SphereGeometry(0.58, 36, 28), whiteMat);
body.scale.set(0.92, 1.12, 0.88);
body.position.y = -0.42;
root.add(body);

const base = new THREE.Mesh(new THREE.SphereGeometry(0.42, 28, 20), whiteMat);
base.scale.set(1.05, 0.55, 1.0);
base.position.y = -0.95;
root.add(base);

const chest = new THREE.Mesh(new THREE.CircleGeometry(0.11, 24), accentMat);
chest.position.set(0, -0.28, 0.52);
root.add(chest);

const head = new THREE.Group();
head.position.y = 0.48;
root.add(head);

const skull = new THREE.Mesh(new THREE.SphereGeometry(0.62, 40, 32), whiteMat);
skull.scale.set(1.05, 0.98, 0.95);
head.add(skull);

// Single dark glossy visor (no meatball eyes, no brow slugs)
const visor = new THREE.Mesh(
  new THREE.SphereGeometry(0.48, 32, 24, 0, Math.PI * 2, 0.35, 1.05),
  visorMat
);
visor.scale.set(1.05, 0.72, 0.55);
visor.position.set(0, 0.04, 0.42);
head.add(visor);

function makeSpot(x) {
  const g = new THREE.Group();
  g.position.set(x, 0.06, 0.62);
  const spot = new THREE.Mesh(new THREE.SphereGeometry(0.095, 18, 14), x < 0 ? eyeMatL : eyeMatR);
  spot.scale.set(1.15, 1.0, 0.45);
  g.add(spot);
  // soft glow halo
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 14, 12),
    new THREE.MeshBasicMaterial({
      color: 0x5ce1ff, transparent: true, opacity: 0.22, depthSide: THREE.BackSide,
    })
  );
  halo.scale.set(1.2, 1.05, 0.5);
  g.add(halo);
  g.userData = { spot, halo, baseSX: 1.15, baseSY: 1.0 };
  return g;
}
const spotL = makeSpot(-0.17);
const spotR = makeSpot(0.17);
head.add(spotL, spotR);

// Tiny smile notch under visor (subtle — expression mainly in spots)
const mouth = new THREE.Mesh(
  new THREE.TorusGeometry(0.07, 0.012, 8, 16, Math.PI * 0.9),
  mouthMat
);
mouth.position.set(0, -0.22, 0.58);
mouth.rotation.x = Math.PI;
mouth.scale.set(1, 0.7, 1);
head.add(mouth);

const antenna = new THREE.Group();
antenna.position.set(0, 0.66, 0);
head.add(antenna);
const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.028, 0.22, 10), whiteMat);
stem.position.y = 0.11;
antenna.add(stem);
const tip = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 14), accentMat);
tip.position.y = 0.26;
antenna.add(tip);

// Emotion → spot shape / brightness / body (no giant carved frown)
const POSES = {
  neutral: {
    spotSX: 1.15, spotSY: 1.0, glow: 1.6, lookX: 0, lookY: 0,
    headPitch: 0, headYaw: 0, bounce: 0.02, antenna: 0.06, mouth: 0.7, smile: 0,
  },
  happy: {
    spotSX: 1.35, spotSY: 1.2, glow: 2.1, lookX: 0, lookY: 0.02,
    headPitch: -0.06, headYaw: 0, bounce: 0.1, antenna: 0.12, mouth: 1.1, smile: 1,
  },
  sad: {
    spotSX: 1.05, spotSY: 0.55, glow: 0.7, lookX: 0, lookY: -0.08,
    headPitch: 0.22, headYaw: 0, bounce: 0, antenna: 0.03, mouth: 0.45, smile: -0.6,
  },
  angry: {
    spotSX: 1.4, spotSY: 0.28, glow: 1.3, lookX: 0, lookY: 0.04,
    headPitch: -0.1, headYaw: 0, bounce: 0, antenna: 0.05, mouth: 0.35, smile: -0.3,
  },
  surprised: {
    spotSX: 1.55, spotSY: 1.55, glow: 2.4, lookX: 0, lookY: 0.04,
    headPitch: -0.12, headYaw: 0, bounce: 0.04, antenna: 0.18, mouth: 0.9, smile: 0.2,
  },
  sleepy: {
    spotSX: 1.25, spotSY: 0.18, glow: 0.45, lookX: 0.02, lookY: -0.03,
    headPitch: 0.32, headYaw: 0.1, bounce: 0, antenna: 0.02, mouth: 0.4, smile: 0.15,
  },
  thinking: {
    spotSX: 1.1, spotSY: 0.95, glow: 1.5, lookX: 0.12, lookY: 0.03,
    headPitch: 0.05, headYaw: -0.28, bounce: 0.01, antenna: 0.35, mouth: 0.55, smile: 0.1,
  },
};

let pose = POSES.neutral;

function setEmotion(name) {
  poseName = EMOTIONS.includes(name) ? name : "neutral";
  pose = POSES[poseName];
  tip.material.emissiveIntensity = poseName === "thinking" ? 0.9 : 0.55;
  tip.material.color.setHex(poseName === "angry" ? 0xff7a6a : poseName === "thinking" ? 0xffc857 : 0x3db4ff);
  tip.material.emissive.setHex(poseName === "angry" ? 0x4a1510 : poseName === "thinking" ? 0x553300 : 0x0a3a66);
  chest.material.emissiveIntensity = poseName === "happy" ? 0.85 : 0.55;
}

function applySpots(blinkSquint) {
  const p = pose;
  let sy = p.spotSY * (blinkSquint ? 0.12 : 1);
  let glow = p.glow * (blinkSquint ? 0.25 : 1);
  if (state.speaking && !blinkSquint) {
    glow *= 1.15 + 0.25 * Math.abs(Math.sin(speakPhase));
  }
  [spotL, spotR].forEach((g, i) => {
    const sx = p.spotSX * (p.spotSY < 0.4 && poseName === "angry" ? 1.05 : 1);
    g.userData.spot.scale.set(sx, sy, 0.45);
    g.userData.halo.scale.set(sx * 1.05, Math.max(0.2, sy) * 1.1, 0.5);
    g.userData.spot.material.emissiveIntensity = glow;
    g.userData.halo.material.opacity = 0.12 + glow * 0.08;
    const lx = p.lookX + (state.listening ? 0.03 : 0);
    const ly = p.lookY;
    g.position.x = (i === 0 ? -0.17 : 0.17) + lx * 0.15;
    g.position.y = 0.06 + ly;
  });
  // subtle mouth — never a giant horseshoe through the head
  if (p.smile > 0.5) {
    mouth.scale.set(1.15 * p.mouth, 1.1, 1);
    mouth.rotation.z = 0;
    mouth.material.opacity = 0.5;
  } else if (p.smile < -0.4) {
    mouth.scale.set(0.9 * p.mouth, 0.55, 1);
    mouth.rotation.z = Math.PI;
    mouth.material.opacity = 0.35;
  } else {
    mouth.scale.set(p.mouth, 0.65, 1);
    mouth.rotation.z = poseName === "thinking" ? 0.15 : 0;
    mouth.material.opacity = 0.4;
  }
}

setEmotion("neutral");

function resize() {
  const w = canvas.clientWidth || 220;
  const h = canvas.clientHeight || 260;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
resize();
addEventListener("resize", resize);

function animate(t) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (animate.prev ? t - animate.prev : 16) / 1000);
  animate.prev = t;
  swayT += dt;
  blinkT += dt;

  const emo = state.emotion || "neutral";
  if (poseName !== emo) setEmotion(emo);
  const p = pose;
  const slumped = !state.awake;

  head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, slumped ? Math.max(p.headPitch, 0.4) : p.headPitch, 0.12);
  head.rotation.y = THREE.MathUtils.lerp(
    head.rotation.y,
    slumped ? p.headYaw * 0.4 : (state.listening && !state.speaking ? p.headYaw - 0.08 : p.headYaw),
    0.12
  );

  let blink = false;
  if (!slumped && emo !== "sleepy" && !state.speaking) {
    if (blinkT > nextBlink) {
      blink = true;
      if (blinkT > nextBlink + 0.12) {
        blinkT = 0;
        nextBlink = 2.4 + Math.random() * 3.2;
      }
    }
  }
  if (slumped) blink = true; // spots to thin lines when fully asleep
  applySpots(blink || emo === "sleepy" && slumped);

  // Gentle hover — not a seizure
  const bob = slumped ? 0 : 0.035 + p.bounce * 0.5;
  let y = Math.sin(swayT * 1.6) * bob;
  if (state.speaking) {
    speakPhase += dt * 11;
    y += Math.abs(Math.sin(speakPhase)) * 0.02;
    chest.material.emissiveIntensity = 0.55 + 0.45 * Math.abs(Math.sin(speakPhase));
    visor.material.emissive = new THREE.Color(0x0a3048);
    visor.material.emissiveIntensity = 0.15 + 0.2 * Math.abs(Math.sin(speakPhase));
  } else {
    chest.material.emissiveIntensity = THREE.MathUtils.lerp(chest.material.emissiveIntensity, poseName === "happy" ? 0.85 : 0.55, 0.1);
    visor.material.emissiveIntensity = THREE.MathUtils.lerp(visor.material.emissiveIntensity || 0, 0, 0.1);
  }
  root.position.y = THREE.MathUtils.lerp(root.position.y, slumped ? -0.22 : y, 0.1);
  root.rotation.z = THREE.MathUtils.lerp(root.rotation.z, Math.sin(swayT * 1.1) * (slumped ? 0.04 : 0.03) + (slumped ? 0.2 : 0), 0.08);

  antenna.rotation.z = Math.sin(swayT * (2.5 + p.antenna * 6)) * p.antenna;
  shadow.scale.setScalar(slumped ? 0.85 : 1 + Math.sin(swayT * 1.6) * 0.04);
  shadow.material.opacity = slumped ? 0.12 : 0.18;

  renderer.render(scene, camera);
  reportHitRect();
}
requestAnimationFrame(animate);

function reportHitRect() {
  if (!window.pywebview?.api?.update_hit_rect) return;
  const r = canvas.getBoundingClientRect();
  const padX = r.width * 0.18;
  const padY = r.height * 0.12;
  window.pywebview.api.update_hit_rect(r.left + padX, r.top + padY, r.right - padX, r.bottom - padY * 0.5);
}

async function poll() {
  try {
    const r = await fetch("/status", { cache: "no-store" });
    if (!r.ok) return;
    const s = await r.json();
    const next = s.emotion || "neutral";
    if (next !== state.emotion) setEmotion(next);
    state = {
      emotion: next,
      awake: !!s.awake,
      listening: !!s.listening,
      speaking: !!s.speaking,
      last_said: s.last_said || "",
      last_heard: s.last_heard || "",
      pet_monitor: s.pet_monitor ?? 0,
      pet_corner: s.pet_corner || "bottom-right",
      monitors: s.pet_monitors ?? 1,
    };
  } catch (_) {}
}
setInterval(poll, 200);
poll();

async function api(action, payload = {}) {
  await fetch("/api/" + action, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Rocky-Console": "1" },
    body: JSON.stringify(payload),
  });
}

function buildMenu() {
  const parts = [
    `<button type="button" data-act="sleep">${state.awake ? "Sleep" : "Wake"}</button>`,
    `<button type="button" data-act="listen">${state.listening ? "Stop listen" : "Listen"}</button>`,
    `<button type="button" data-act="console">Open console</button>`,
    `<button type="button" data-act="quit">Quit face</button>`,
    `<div class="sep">Monitor</div>`,
  ];
  const n = Math.max(1, state.monitors | 0);
  for (let i = 0; i < n; i++) {
    const mark = i === state.pet_monitor ? " ✓" : "";
    parts.push(`<button type="button" data-act="monitor" data-n="${i}">Send to monitor ${i}${mark}</button>`);
  }
  parts.push(`<div class="sep">Corner</div>`);
  for (const c of ["bottom-right", "bottom-left", "top-right", "top-left"]) {
    const mark = c === state.pet_corner ? " ✓" : "";
    parts.push(`<button type="button" data-act="corner" data-c="${c}">${c}${mark}</button>`);
  }
  menu.innerHTML = parts.join("");
}

canvas.addEventListener("click", (ev) => {
  menu.classList.remove("show");
  const text = (state.last_said || "").replace(/\s+/g, " ").trim();
  bubble.textContent = text || (state.awake ? "…" : "(sleeping)");
  bubble.classList.add("show");
  clearTimeout(bubble._t);
  bubble._t = setTimeout(() => bubble.classList.remove("show"), 4500);
  ev.stopPropagation();
});

canvas.addEventListener("contextmenu", (ev) => {
  ev.preventDefault();
  bubble.classList.remove("show");
  buildMenu();
  menu.style.left = Math.min(ev.clientX, innerWidth - 180) + "px";
  menu.style.top = Math.min(ev.clientY, innerHeight - 200) + "px";
  menu.classList.add("show");
});

document.addEventListener("click", () => menu.classList.remove("show"));

menu.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  const act = btn.dataset.act;
  menu.classList.remove("show");
  if (act === "sleep") await api("sleep", { on: !!state.awake });
  else if (act === "listen") await api("listen", { on: !state.listening });
  else if (act === "console") {
    if (window.pywebview?.api?.open_console) window.pywebview.api.open_console();
    else window.open("/", "_blank");
  } else if (act === "quit") {
    if (window.pywebview?.api?.quit_face) window.pywebview.api.quit_face();
  } else if (act === "monitor") {
    await api("pet_dock", { monitor: Number(btn.dataset.n), corner: state.pet_corner });
  } else if (act === "corner") {
    await api("pet_dock", { monitor: state.pet_monitor, corner: btn.dataset.c });
  }
});
</script>
</body>
</html>
